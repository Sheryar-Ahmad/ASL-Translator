asl:
  auto:
    reset_ms: 1400
    stable_ms: 900
    vote_window: 9
  commit_mode: manual
  confidence_threshold: 0.5357142857142857
  draw_landmarks: true
  feature_size: 210
  feature_type: pairwise_distance
  image_input_size: 64
  image_margin: 0.25
  image_normalization: unit
  input_type: landmarks
  labels:
    delete_label: delete
    nothing_label: nothing
    space_label: space
  labels_path: models/asl/labels.txt
  max_hands: 1
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.6
  model_path: models/asl/asl_landmarks.onnx
  use_z: true
camera:
  fps: 30
  height: 480
  index: 0
  mirror: true
  width: 640
sentence:
  auto_speak: true
  clear_after_speak: false
  complete_pause_ms: 2500
  min_chars: 3
  max_sentence_length: 200
  speak_on_space: true
  stable_frames: 15
  cooldown_frames: 45
tts:
  autoplay: true
  engine: piper
  model_path: models/tts/en_US-lessac-high.onnx
  output_dir: .cache/tts
  piper_executable: piper
  device: ''
  voice: ''
ui:
  show_fps: true
  window_name: ASL Translator
